name: Android test release

on:
  push:
    tags:
      - 'v*-daemon.*'

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and sync native projects
        working-directory: frontend
        run: npm run build:mobile

      - name: Build Android debug package
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage release files
        run: |
          mkdir -p dist
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            dist/CyberGym-0.1.0-daemon-debug.apk
          cd dist
          sha256sum CyberGym-0.1.0-daemon-debug.apk \
            > CyberGym-0.1.0-daemon-debug.apk.sha256

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/CyberGym-0.1.0-daemon-debug.apk \
            dist/CyberGym-0.1.0-daemon-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cyber Gym 0.1.0 — DAEMON test build" \
            --notes "Android test build with BLACKWALL and DAEMON CRT themes. Debug application id: com.kurubik.cybergym.test. Minimum Android version: 6." \
            --prerelease
